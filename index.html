*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 110px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
svg{display:block;flex:none}
.note{color:var(--muted);font-size:14px}
.tlabel{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em}
.brand b{color:var(--accent)}
.brand.big{font-size:24px}
.stats{display:flex;gap:12px;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:4px}
.chip{border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--surface);cursor:pointer}

.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:0;background:var(--raise);border-radius:10px;padding:8px 13px;font:600 14px/1 var(--body);cursor:pointer;white-space:nowrap}
.fchip.on{background:var(--ink);color:var(--bg)}

.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;display:flex;align-items:center;justify-content:center;padding:28px 18px}

.thumb>*{position:relative;z-index:1}
.tshow{position:absolute;top:10px;left:12px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.92;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tline{font-family:var(--display);font-weight:700;font-size:clamp(17px,4.6vw,22px);line-height:1.25;text-align:center;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.thumb.big{border-radius:16px}

.tbadges{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.tb{background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:3px 7px;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.tb.ok{color:#7CF0AE}

.cmeta{min-width:0}
.ctitle{font-weight:700;font-size:16px;line-height:1.3}
.csub{color:var(--muted);font-size:13px;margin-top:3px}
.lh{display:flex;align-items:center;gap:10px;padding-block:8px 12px}
.lh .note{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{background:none;border:0;padding:6px;cursor:pointer;color:var(--ink);border-radius:8px}
.x.sv.on{color:var(--gold)}
.ytb{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;background:var(--accent);color:var(--on);text-decoration:none;font-weight:700;border-radius:12px;padding:13px 16px;box-shadow:0 4px 0 var(--accent-d)}

.sec{margin-top:24px}
.sec p{margin:0 0 10px;max-width:65ch}
.sit{font-size:16px}
.linebox{margin-top:22px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px}
.ltag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.lline{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.3;margin-block:8px 12px}
.lctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{background:var(--raise);color:var(--ink);border:0;border-radius:10px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
.lnk{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:8px 4px;font-size:15px;text-align:left}

.gl{background:var(--surface);border-radius:12px;padding:6px 14px;border:2px solid var(--line)}
.gr{display:flex;justify-content:space-between;gap:12px;padding-block:8px;border-top:1px solid var(--line)}
.gr:first-child{border-top:0}
.gr span:first-child{font-weight:700}
.gr span:last-child{color:var(--muted);text-align:right}
.qq{font-weight:600;font-size:17px}
.qq .gap{display:inline-block;min-width:3em;border-bottom:3px solid var(--accent);color:var(--ok);text-align:center}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.row3{flex-direction:row;flex-wrap:wrap}
.opts.row3 .opt{flex:1 1 90px;justify-content:center}
.opt{text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);border-radius:14px;padding:14px 16px;font:500 16px/1.35 var(--body);cursor:pointer;display:flex;flex-direction:column;gap:6px}

.opt.dim{opacity:.7}
.opt:disabled{cursor:default;color:var(--ink)}
.oex{font-size:14px;color:var(--muted)}
.opt.ok .oex,.opt.bad .oex{color:var(--ink)}
.done{margin-top:26px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}

.empty{background:var(--surface);border:2px dashed var(--line);border-radius:16px;padding:22px;margin-top:16px}

.tab.on{color:var(--ink)}

.pwrap{aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#000}
.pwrap iframe{width:100%;height:100%;border:0;display:block}
.pstart{width:100%;height:100%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:700 17px var(--body)}

.own{margin-top:14px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.own summary{cursor:pointer;font-weight:700;color:var(--accent)}
.own p{margin:8px 0}
.ownrow{display:flex;gap:8px}
.ownrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font:500 15px var(--body);background:var(--bg);color:var(--ink)}

.ep{font-size:13px;color:var(--gold);font-weight:600;margin:0 0 6px}

 if(FILTER==="me")a=SC.filter(function(s){return li(s.lvl)<=li(S.lvl)+1});
 else if(FILTER==="all")a=SC.slice();
 else a=SC.filter(function(s){return s.sh===FILTER});
 var undone=a.filter(function(s){return !S.done[s.id]}),done=a.filter(function(s){return S.done[s.id]});
 if(FILTER==="me"||FILTER==="all"){
  var by={};shuf(undone).forEach(function(s){(by[s.sh]=by[s.sh]||[]).push(s)});
  undone.sort(function(x,y){return Math.abs(li(x.lvl)-li(S.lvl))-Math.abs(li(y.lvl)-li(S.lvl))});
  var keys=Object.keys(by),out=[],k=0;
  keys.forEach(function(key){by[key].sort(function(x,y){return Math.abs(li(x.lvl)-li(S.lvl))-Math.abs(li(y.lvl)-li(S.lvl))})});
  keys=shuf(keys);
  while(out.length<undone.length){var key=keys[k%keys.length];if(by[key].length)out.push(by[key].shift());k++}
  undone=out;
 }
 return undone.concat(done);
}
function thumb(s,big){var sh=SHOWS[s.sh];
 return '<div class="thumb'+(big?" big":"")+'" style="--c1:'+sh.c[0]+';--c2:'+sh.c[1]+'"><div class="tshow">'+esc(sh.t)+'</div><div class="tline" lang="en">'+esc(s.line)+'</div><div class="tbadges"><span class="tb">'+s.lvl+"</span>"+(S.done[s.id]?'<span class="tb ok">'+IC.check+" пройдено</span>":"")+'</div>'+(big?"":'<span class="tplay">'+IC.play+"</span>")+(!big&&vidFor(s)?'<span class="tb vid">видео</span>':"")+"</div>"}
function feed(){
 if(!S.lvl)return pickLevel();
 showNav("feed");LIST=feedList();
 var chips=[["me","Для меня"],["all","Все"]].concat(Object.keys(SHOWS).map(function(k){return [k,SHOWS[k].t]}));
 var doneN=SC.filter(function(s){return S.done[s.id]}).length;
 app.innerHTML=topBar()+'<div class="chips" role="tablist">'+chips.map(function(c){return '<button class="fchip'+(c[0]===FILTER?" on":"")+'" data-f="'+c[0]+'">'+esc(c[1])+"</button>"}).join("")+'</div><p class="note" style="margin-block:2px 14px">Пройдено сцен: '+doneN+" из "+SC.length+'</p><div class="grid">'+LIST.map(function(s){var sh=SHOWS[s.sh];return '<button class="card" data-id="'+s.id+'">'+thumb(s)+'<div class="cmeta"><div class="ctitle">'+esc(s.ti)+'</div><div class="csub">'+esc(sh.t)+" · "+esc(s.who)+" · "+(s.q?"цитата":"фраза для урока")+"</div></div></button>"}).join("")+"</div>"+(LIST.length?"":'<p class="note">Здесь пока пусто.</p>');
 wireTop();
 app.querySelectorAll(".fchip").forEach(function(b){b.onclick=function(){FILTER=b.dataset.f;feed()}});
 var on=app.querySelector(".fchip.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"center"});
 app.querySelectorAll(".card").forEach(function(b){b.onclick=function(){scene(b.dataset.id)}});
 toTop();
}

/* ---------- scene ---------- */
function fmtT(t){t=Math.max(0,Math.round(t));return Math.floor(t/60)+":"+("0"+t%60).slice(-2)}
function parseYT(u){u=String(u||"").trim();var m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([A-Za-z0-9_-]{11})/)||u.match(/^([A-Za-z0-9_-]{11})$/);if(!m)return null;
 var t=0,q=u.match(/[?&#](?:t|start)=([0-9hms]+)/);if(q){var x=q[1];if(/^\d+$/.test(x))t=+x;else{var h=x.match(/(\d+)h/),mm=x.match(/(\d+)m/),ss=x.match(/(\d+)s/);t=(h?+h[1]*3600:0)+(mm?+mm[1]*60:0)+(ss?+ss[1]:0)}}
 return {v:m[1],t:t}}
function vidFor(s){var own=S.links[s.id];if(own)return {v:own.v,t:S.marks[s.id]!=null?S.marks[s.id]:own.t||0,own:1};var v=VIDS[s.id];if(v)return {v:v[0],t:S.marks[s.id]!=null?S.marks[s.id]:0,exact:v[1]};return null}
function yt(s){var f=vidFor(s);return f?"https://www.youtube.com/watch?v="+f.v+(f.t?"&t="+f.t+"s":""):"https://www.youtube.com/results?search_query="+encodeURIComponent(s.yt)}
var SANDBOX=/claude|anthropic/i.test(location.hostname)||location.protocol==="file:"||location.protocol==="content:";
var YTP=null,apiState=0,apiQueue=[];
function withAPI(cb){if(apiState===2&&window.YT&&YT.Player)return cb();apiQueue.push(cb);if(apiState)return;apiState=1;
 var prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=function(){apiState=2;if(prev)try{prev()}catch(e){}var q=apiQueue;apiQueue=[];q.forEach(function(f){f()})};
 var sc=document.createElement("script");sc.src="https://www.youtube.com/iframe_api";sc.onerror=function(){apiState=0;apiQueue=[];var pw=$("#pw");if(pw)pw.innerHTML='<div class="perr">Плеер не загрузился. Откройте ролик по ссылке ниже.</div>'};document.head.appendChild(sc)}
function playerHTML(s){
 var f=vidFor(s),h="";
 if(f&&!SANDBOX){
  h='<div class="pwrap" id="pw"><button class="pstart" id="pst" style="--c1:'+SHOWS[s.sh].c[0]+';--c2:'+SHOWS[s.sh].c[1]+'"><span class="pbig">'+IC.play+'</span><span>Смотреть сцену</span><span class="note2">'+(f.own?"Ваше видео":f.exact===1?"Ролик с этой репликой":f.exact===2?"Клип из этой серии — реплика может быть в другой части":"Подборка моментов")+(f.t?" · с "+fmtT(f.t):"")+"</span></button></div>"+
  '<div class="pctl"><button class="btn ghost small" id="mk" disabled>Момент начинается здесь</button><a class="ytl" href="'+yt(s)+'" target="_blank" rel="noopener">Открыть на YouTube '+IC.ext+'</a></div><p class="note" id="mknote">'+(S.marks[s.id]!=null?"Сохранённое начало: "+fmtT(S.marks[s.id])+".":"Запустите видео и нажмите кнопку там, где начинается сцена: в следующий раз ролик откроется с этого места, с запасом 4 секунды для контекста.")+"</p>";
 }else{
  h=thumb(s,true)+'<a class="ytb" href="'+yt(s)+'" target="_blank" rel="noopener">'+IC.play+"<span>"+(f?"Смотреть на YouTube"+(f.t?" с "+fmtT(f.t):""):"Найти сцену на YouTube")+"</span>"+IC.ext+"</a>"+(f&&SANDBOX?'<p class="note" style="margin-top:8px">Внутри Claude плеер заблокирован. На вашем сайте GitHub Pages видео играет прямо здесь.</p>':"");
 }
 h+='<details class="own"'+(f?"":" open")+'><summary>'+(f?"Заменить видео своей ссылкой":"Видео для этой сцены пока нет. Вставьте свою ссылку")+'</summary><p class="note">Найдите момент на YouTube, нажмите «Поделиться» → «Копировать ссылку» и вставьте сюда. Если в ссылке есть время (например, ?t=83), ролик начнётся с него.</p><div class="ownrow"><input id="ownu" type="url" inputmode="url" placeholder="https://youtu.be/…" autocomplete="off"><button class="btn small" id="owns">Сохранить</button></div><p class="note" id="ownmsg"></p>'+(S.links[s.id]?'<button class="lnk" id="ownd">Убрать мою ссылку</button>':"")+"</details>";
 return h}
function wirePlayer(s,rebuild){
 var pst=$("#pst");
 if(pst)pst.onclick=function(){if(canSpeak)try{speechSynthesis.cancel()}catch(e){}var f=vidFor(s);$("#pw").innerHTML='<div id="ytp"></div>';
  withAPI(function(){try{YTP=new YT.Player("ytp",{videoId:f.v,playerVars:{start:f.t||0,autoplay:1,rel:0,playsinline:1,modestbranding:1},events:{onReady:function(e){var mk=$("#mk");if(mk)mk.disabled=false;try{e.target.playVideo()}catch(x){}},onError:function(){var pw=$("#pw");if(pw)pw.innerHTML='<div class="perr">Автор ролика запретил встраивание. Откройте его по ссылке ниже или вставьте другую ссылку.</div>'}}})}catch(e){}})};
 var mk=$("#mk");if(mk)mk.onclick=function(){if(!YTP||!YTP.getCurrentTime)return;var t=Math.max(0,Math.floor(YTP.getCurrentTime())-4);S.marks[s.id]=t;save();$("#mknote").textContent="Сохранено: сцена начнётся с "+fmtT(t)+" (на 4 секунды раньше, чтобы был понятен контекст).";var a=app.querySelector(".ytl");if(a)a.href=yt(s)};
 var ou=$("#owns");if(ou)ou.onclick=function(){var p=parseYT($("#ownu").value);if(!p){$("#ownmsg").textContent="Это не похоже на ссылку YouTube. Скопируйте ссылку через кнопку «Поделиться».";return}
  S.links[s.id]=p;delete S.marks[s.id];if(p.t)S.marks[s.id]=Math.max(0,p.t-4);save();rebuild()};
 var od=$("#ownd");if(od)od.onclick=function(){delete S.links[s.id];delete S.marks[s.id];save();rebuild()};
}
function scene(id){
 var s=SC.filter(function(x){return x.id===id})[0],sh=SHOWS[s.sh];
 nav.hidden=true;YTP=null;
 var st={t1:null,t2:null};
 var opts1=shuf(s.t.map(function(o,i){return {txt:o[0],ok:o[1],ex:o[2],i:i}}));
 var opts2=shuf(s.gp[1]);
 app.innerHTML='<div class="lh"><button class="x" id="back" aria-label="Назад">'+IC.back+'</button><span class="note">'+esc(sh.t)+'</span><button class="x sv" id="sv" aria-label="Сохранить фразу"></button></div><div id="phead"></div><div id="sbody"></div>';
 function head(){$("#phead").innerHTML=playerHTML(s);wirePlayer(s,head)}
 function svIcon(){var b=$("#sv");b.innerHTML=S.saved[s.id]?IC.saved:IC.save;b.classList.toggle("on",!!S.saved[s.id])}
 function render(){
  var solved=st.t1!=null&&st.t2!=null,film=["hp","shrek","toy","lotr","spider","panda","sw","pirates","nemo","frozen","up","lion","rata","desp","mad","term","gump","titanic","cap","dk","matrix","bttf","zoo"].indexOf(s.sh)>=0;
  $("#sbody").innerHTML='<div class="sec"><div class="tlabel">Сцена · '+esc(s.who)+'</div>'+(s.ep?'<p class="ep">Серия: '+esc(s.ep)+(s.sh==="adv"&&s.q?' · реплика сверена с расшифровкой на Adventure Time Wiki':'')+'</p>':'')+'<p class="sit">'+esc(s.sit)+"</p></div>"+
  '<div class="linebox"><div class="ltag">'+(s.q?"Цитата из "+(film?"фильма":s.id==="wi1"?"игры":"сериала"):"Фраза для урока в духе сцены")+'</div><div class="lline" lang="en">'+esc(s.line)+'</div><div class="lctl">'+(canSpeak?'<button class="mini" id="sp" aria-label="Прослушать">'+IC.spk+'</button><button class="mini" id="sps" aria-label="Медленно">'+IC.slow+"</button>":"")+'<button class="lnk" id="trb">'+(st.tr?"Скрыть перевод":"Показать перевод")+'</button></div><div class="ltr" '+(st.tr?"":"hidden")+">"+esc(s.ru)+"</div></div>"+
  '<div class="sec"><div class="tlabel">Разбор</div><p>'+esc(s.note)+'</p><div class="gl">'+s.w.map(function(w){return '<div class="gr"><span lang="en">'+esc(w[0])+"</span><span>"+esc(w[1])+"</span></div>"}).join("")+"</div></div>"+
  '<div class="sec"><div class="tlabel">Задача 1 · Где это уместно?</div><p class="qq">В какой ситуации эту фразу естественно сказать?</p><div class="opts">'+opts1.map(function(o,k){var cls="";if(st.t1!=null){cls=o.ok?"ok":(k===st.t1?"bad":"dim")}return '<button class="opt '+cls+'" data-k="'+k+'" '+(st.t1!=null?"disabled":"")+'><span class="otx">'+esc(o.txt)+"</span>"+(st.t1!=null?'<span class="oex">'+esc(o.ex)+"</span>":"")+"</button>"}).join("")+"</div></div>"+
  (st.t1!=null?'<div class="sec"><div class="tlabel">Задача 2 · Закрепим</div><p class="qq" lang="en">'+esc(s.gp[0]).split("___").join('<span class="gap">'+(st.t2!=null?esc(s.gp[1][0]):"&nbsp;")+"</span>")+'</p><div class="opts row3">'+opts2.map(function(o,k){var cls="";if(st.t2!=null){cls=o===s.gp[1][0]?"ok":(k===st.t2?"bad":"dim")}return '<button class="opt c '+cls+'" data-k2="'+k+'" '+(st.t2!=null?"disabled":"")+">"+esc(o)+"</button>"}).join("")+"</div></div>":"")+
  (solved?'<div class="done"><div class="dh">'+(st.score===2?"Отлично, обе задачи верно!":st.score===1?"Одна из двух — тоже прогресс.":"Ничего, разбор выше поможет запомнить.")+'</div><div class="note">+'+st.xp+' XP</div><div class="stack"><button class="btn" id="next">Следующая сцена</button>'+(S.saved[s.id]?"":'<button class="btn ghost" id="sv2">Сохранить фразу</button>')+"</div></div>":"");
  var sv2=$("#sv2");if(sv2)sv2.onclick=toggleSave;
  var sp=$("#sp");if(sp){sp.onclick=function(){speak(s.line)};$("#sps").onclick=function(){speak(s.line,.6)}}
  $("#trb").onclick=function(){st.tr=!st.tr;render()};
  $("#sbody").querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){st.t1=+b.dataset.k;tone(!!opts1[st.t1].ok);render()}});
  $("#sbody").querySelectorAll("[data-k2]").forEach(function(b){b.onclick=function(){st.t2=+b.dataset.k2;var ok=opts2[st.t2]===s.gp[1][0];tone(ok);if(ok)speak(s.gp[0].replace("___",s.gp[1][0]));
   st.score=(opts1[st.t1].ok?1:0)+(ok?1:0);var first=!S.done[s.id];st.xp=first?5+st.score*5:2;S.done[s.id]=1;addXP(st.xp);render()}});
  var nx=$("#next");if(nx)nx.onclick=function(){LIST=feedList();var nxt=LIST.filter(function(x){return !S.done[x.id]})[0]||LIST.filter(function(x){return x.id!==s.id})[0];nxt?scene(nxt.id):feed()};
 }
 function toggleSave(){if(S.saved[s.id])delete S.saved[s.id];else S.saved[s.id]=Date.now();save();svIcon();render()}
 $("#back").onclick=function(){YTP=null;feed()};$("#sv").onclick=toggleSave;
 svIcon();head();render();toTop();
 if(canSpeak)setTimeout(function(){speak(s.line)},300);
}

/* ---------- shows ---------- */
function showsTab(){
 showNav("shows");
 app.innerHTML=topBar()+'<h1 class="h1s">Сериалы и фильмы</h1><p class="note" style="margin-bottom:16px">Выберите, чтобы смотреть сцены только оттуда.</p><div class="slist">'+Object.keys(SHOWS).map(function(k){var sh=SHOWS[k],all=SC.filter(function(s){return s.sh===k}),d=all.filter(function(s){return S.done[s.id]}).length;return '<button class="srow" data-k="'+k+'"><span class="sw" style="--c1:'+sh.c[0]+';--c2:'+sh.c[1]+'"></span><span class="sn"><b>'+esc(sh.t)+'</b><span class="note" lang="en">'+esc(sh.en)+'</span></span><span class="sc">'+d+"/"+all.length+"</span></button>"}).join("")+"</div>";
 wireTop();
 app.querySelectorAll(".srow").forEach(function(b){b.onclick=function(){FILTER=b.dataset.k;feed()}});toTop();
}
function savedTab(){
 showNav("saved");
 var ids=Object.keys(S.saved).sort(function(a,b){return S.saved[b]-S.saved[a]});
 app.innerHTML=topBar()+'<h1 class="h1s">Мои фразы</h1>'+(ids.length?'<p class="note" style="margin-bottom:16px">Нажмите на фразу, чтобы услышать её; на название — чтобы открыть сцену.</p><div class="slist">'+ids.map(function(id){var s=SC.filter(function(x){return x.id===id})[0];if(!s)return "";return '<div class="phr"><button class="pl" data-s="'+esc(s.line)+'" lang="en">'+esc(s.line)+'</button><div class="note">'+esc(s.ru)+'</div><button class="lnk" data-id="'+s.id+'">'+esc(SHOWS[s.sh].t)+" · "+esc(s.ti)+" ›</button></div>"}).join("")+"</div>":'<div class="empty"><p>Здесь появятся фразы, которые вы сохраните.</p><p class="note">В сцене нажмите на закладку вверху справа или на «Сохранить фразу» после задач.</p><button class="btn" id="tofeed" style="margin-top:14px">Открыть ленту</button></div>');
 wireTop();
 app.querySelectorAll(".pl").forEach(function(b){b.onclick=function(){speak(b.dataset.s)}});
 app.querySelectorAll(".lnk[data-id]").forEach(function(b){b.onclick=function(){scene(b.dataset.id)}});
 var tf=$("#tofeed");if(tf)tf.onclick=function(){FILTER="me";feed()};toTop();
}
S.lvl?feed():pickLevel();

})();
</script>
</body></html>
