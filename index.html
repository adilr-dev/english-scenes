*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}

svg{display:block;flex:none}

.ctitle{font-weight:700;font-size:16px;line-height:1.3}

 ext:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};
var LV=["A2","B1","B2","C1"],LVN={A2:"A2 · Band 3–4",B1:"B1 · Band 4.5–5",B2:"B2 · Band 5.5–6.5",C1:"C1 · Band 7+"};
var $=function(s){return document.querySelector(s)};
var app=$("#app"),nav=$("#nav");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function toTop(){window.scrollTo(0,0)}
var KEY="linebyline-v1";
function fresh(){return {lvl:null,done:{},saved:{},xp:0,streak:0,last:null}}
var S=fresh();try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ds(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function streak(){var t=ds(new Date()),y=ds(new Date(Date.now()-864e5));return (S.last===t||S.last===y)?S.streak:0}
function addXP(n){var t=ds(new Date()),y=ds(new Date(Date.now()-864e5));S.xp+=n;if(S.last!==t){S.streak=S.last===y?S.streak+1:1;S.last=t}save()}
var canSpeak="speechSynthesis" in window;
function speak(t,rate){if(!canSpeak)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/-/g,""));u.lang="en-GB";u.rate=rate||.95;var vs=speechSynthesis.getVoices();var v=vs.filter(function(v){return /^en[-_]GB/i.test(v.lang)})[0]||vs.filter(function(v){return /^en/i.test(v.lang)})[0];if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
try{if(canSpeak)speechSynthesis.getVoices()}catch(e){}
var ac=null;
function tone(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();(ok?[660,880]:[300,220]).forEach(function(f,k){var o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+k*.11;o.frequency.value=f;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.15,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.18);o.connect(g);g.connect(ac.destination);o.start(t0);o.stop(t0+.2)})}catch(e){}}
function yt(s){var v=VIDS[s.id];return v?"https://www.youtube.com/watch?v="+v[0]:"https://www.youtube.com/results?search_query="+encodeURIComponent(s.yt)}
var SANDBOX=/claude|anthropic/i.test(location.hostname)||location.protocol==="file:"||location.protocol==="content:";
function player(s){var v=VIDS[s.id];
 if(v&&!SANDBOX)return '<div class="pwrap" id="pw"><button class="pstart" id="pst" style="--c1:'+SHOWS[s.sh].c[0]+';--c2:'+SHOWS[s.sh].c[1]+'"><span class="pbig">'+IC.play+'</span><span>Смотреть сцену</span><span class="note2">'+(v[1]?"Точный момент с этой репликой":"Подборка моментов с этим персонажем")+'</span></button></div><a class="ytl" href="'+yt(s)+'" target="_blank" rel="noopener">Не играет? Открыть на YouTube '+IC.ext+'</a>';
 return thumb(s,true)+'<a class="ytb" href="'+yt(s)+'" target="_blank" rel="noopener">'+IC.play+'<span>'+(v?(SANDBOX?"Смотреть сцену на YouTube":"Смотреть"):"Найти сцену на YouTube")+'</span>'+IC.ext+"</a>"+(v&&SANDBOX?'<p class="note" style="margin-top:8px">Внутри Claude плеер заблокирован. На своём сайте (GitHub Pages) видео будет играть прямо здесь.</p>':"")}
function li(l){return LV.indexOf(l)}

/* ---------- nav ---------- */
function showNav(tab){nav.hidden=false;var n=Object.keys(S.saved).length;
 nav.innerHTML='<div class="in">'+[["feed","Лента",IC.feed],["shows","Сериалы",IC.shows],["saved","Мои фразы"+(n?" · "+n:""),IC.save]].map(function(x){return '<button class="tab'+(x[0]===tab?" on":"")+'" data-t="'+x[0]+'">'+x[2]+"<span>"+x[1]+"</span></button>"}).join("")+"</div>";
 nav.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){var t=b.dataset.t;if(t==="feed"){FILTER="me";feed()}else if(t==="shows")showsTab();else savedTab()}})}
function topBar(){return '<div class="top"><div class="brand">Line<b>by</b>Line</div><div class="stats"><span class="chip" id="lvch">'+(S.lvl||"")+'</span><span class="stat">'+IC.flame+streak()+'</span><span class="stat">'+IC.bolt+S.xp+"</span></div></div>"}
function wireTop(){var c=$("#lvch");if(c)c.onclick=pickLevel}

/* ---------- onboarding ---------- */
function pickLevel(){
 nav.hidden=true;
 app.innerHTML='<div class="hero"><div class="brand big">Line<b>by</b>Line</div><h1>Английский по любимым мультфильмам и сериалам</h1><p>Сцена, реплика персонажа и задача: где эту фразу можно сказать в жизни, а где она прозвучит странно.</p></div><div class="tlabel" style="margin-top:22px">Ваш уровень</div><div class="lvls">'+LV.map(function(l){return '<button class="lvb'+(S.lvl===l?" on":"")+'" data-l="'+l+'"><b>'+l+"</b><span>"+LVN[l].split(" · ")[1]+"</span></button>"}).join("")+'</div><p class="note" style="margin-top:14px">Лента подберёт сцены вашего уровня и на ступень выше. Уровень можно сменить в любой момент, нажав на значок вверху.</p>';
 app.querySelectorAll(".lvb").forEach(function(b){b.onclick=function(){S.lvl=b.dataset.l;save();FILTER="me";feed()}});toTop();
}

/* ---------- feed ---------- */
var FILTER="me",LIST=[];
function feedList(){
 var a;
 if(FILTER==="me")a=SC.filter(function(s){return li(s.lvl)<=li(S.lvl)+1});
 else if(FILTER==="all")a=SC.slice();
 else a=SC.filter(function(s){return s.sh===FILTER});
 var undone=a.filter(function(s){return !S.done[s.id]}),done=a.filter(function(s){return S.done[s.id]});
 if(FILTER==="me"||FILTER==="all"){
  var by={};shuf(undone).forEach(function(s){(by[s.sh]=by[s.sh]||[]).push(s)});
  undone.sort(function(x,y){return Math.abs(li(x.lvl)-li(S.lvl))-Math.abs(li(y.lvl)-li(S.lvl))});
  var keys=Object.keys(by),out=[],k=0;
  keys.forEach(function(key){by[key].sort(function(x,y){return Math.abs(li(x.lvl)-li(S.lvl))-Math.abs(li(y.lvl)-li(S.lvl))})});
  keys=shuf(keys);
  while(out.length<undone.length){var key=keys[k%keys.length];if(by[key].length)out.push(by[key].shift());k++}
  undone=out;
 }
 return undone.concat(done);
}
function thumb(s,big){var sh=SHOWS[s.sh];
 return '<div class="thumb'+(big?" big":"")+'" style="--c1:'+sh.c[0]+';--c2:'+sh.c[1]+'"><div class="tshow">'+esc(sh.t)+'</div><div class="tline" lang="en">'+esc(s.line)+'</div><div class="tbadges"><span class="tb">'+s.lvl+"</span>"+(S.done[s.id]?'<span class="tb ok">'+IC.check+" пройдено</span>":"")+'</div>'+(big?"":'<span class="tplay">'+IC.play+"</span>")+(!big&&VIDS[s.id]?'<span class="tb vid">видео</span>':"")+"</div>"}
function feed(){
 if(!S.lvl)return pickLevel();
 showNav("feed");LIST=feedList();
 var chips=[["me","Для меня"],["all","Все"]].concat(Object.keys(SHOWS).map(function(k){return [k,SHOWS[k].t]}));
 var doneN=SC.filter(function(s){return S.done[s.id]}).length;
 app.innerHTML=topBar()+'<div class="chips" role="tablist">'+chips.map(function(c){return '<button class="fchip'+(c[0]===FILTER?" on":"")+'" data-f="'+c[0]+'">'+esc(c[1])+"</button>"}).join("")+'</div><p class="note" style="margin-block:2px 14px">Пройдено сцен: '+doneN+" из "+SC.length+'</p><div class="grid">'+LIST.map(function(s){var sh=SHOWS[s.sh];return '<button class="card" data-id="'+s.id+'">'+thumb(s)+'<div class="cmeta"><div class="ctitle">'+esc(s.ti)+'</div><div class="csub">'+esc(sh.t)+" · "+esc(s.who)+" · "+(s.q?"цитата":"фраза для урока")+"</div></div></button>"}).join("")+"</div>"+(LIST.length?"":'<p class="note">Здесь пока пусто.</p>');
 wireTop();
 app.querySelectorAll(".fchip").forEach(function(b){b.onclick=function(){FILTER=b.dataset.f;feed()}});
 var on=app.querySelector(".fchip.on");if(on&&on.scrollIntoView)on.scrollIntoView({block:"nearest",inline:"center"});
 app.querySelectorAll(".card").forEach(function(b){b.onclick=function(){scene(b.dataset.id)}});
 toTop();
}

/* ---------- scene ---------- */
function scene(id){
 var s=SC.filter(function(x){return x.id===id})[0],sh=SHOWS[s.sh];
 nav.hidden=true;
 var st={t1:null,t2:null};
 var opts1=shuf(s.t.map(function(o,i){return {txt:o[0],ok:o[1],ex:o[2],i:i}}));
 var opts2=shuf(s.gp[1]);
 function render(){
  var solved=st.t1!=null&&st.t2!=null;
  app.innerHTML='<div class="lh"><button class="x" id="back" aria-label="Назад">'+IC.back+'</button><span class="note">'+esc(sh.t)+'</span><button class="x sv'+(S.saved[s.id]?" on":"")+'" id="sv" aria-label="Сохранить фразу">'+(S.saved[s.id]?IC.saved:IC.save)+"</button></div>"+player(s)+
  '<div class="sec"><div class="tlabel">Сцена · '+esc(s.who)+'</div><p class="sit">'+esc(s.sit)+"</p></div>"+
  '<div class="linebox"><div class="ltag">'+(s.q?"Цитата из "+(s.sh==="hp"||s.sh==="shrek"||s.sh==="toy"||s.sh==="lotr"||s.sh==="spider"||s.sh==="panda"||s.sh==="sw"?"фильма":"сериала"):"Фраза для урока в духе сцены")+'</div><div class="lline" lang="en">'+esc(s.line)+'</div><div class="lctl">'+(canSpeak?'<button class="mini" id="sp" aria-label="Прослушать">'+IC.spk+'</button><button class="mini" id="sps" aria-label="Медленно">'+IC.slow+"</button>":"")+'<button class="lnk" id="trb">'+(st.tr?"Скрыть перевод":"Показать перевод")+'</button></div><div class="ltr" '+(st.tr?"":"hidden")+">"+esc(s.ru)+"</div></div>"+
  '<div class="sec"><div class="tlabel">Разбор</div><p>'+esc(s.note)+'</p><div class="gl">'+s.w.map(function(w){return '<div class="gr"><span lang="en">'+esc(w[0])+"</span><span>"+esc(w[1])+"</span></div>"}).join("")+"</div></div>"+
  '<div class="sec"><div class="tlabel">Задача 1 · Где это уместно?</div><p class="qq">В какой ситуации эту фразу естественно сказать?</p><div class="opts">'+opts1.map(function(o,k){var cls="";if(st.t1!=null){cls=o.ok?"ok":(k===st.t1?"bad":"dim")}return '<button class="opt '+cls+'" data-k="'+k+'" '+(st.t1!=null?"disabled":"")+'><span class="otx">'+esc(o.txt)+"</span>"+(st.t1!=null?'<span class="oex">'+esc(o.ex)+"</span>":"")+"</button>"}).join("")+"</div></div>"+
  (st.t1!=null?'<div class="sec"><div class="tlabel">Задача 2 · Закрепим</div><p class="qq" lang="en">'+esc(s.gp[0]).split("___").join('<span class="gap">'+(st.t2!=null?esc(s.gp[1][0]):"&nbsp;")+"</span>")+'</p><div class="opts row3">'+opts2.map(function(o,k){var cls="";if(st.t2!=null){cls=o===s.gp[1][0]?"ok":(k===st.t2?"bad":"dim")}return '<button class="opt c '+cls+'" data-k2="'+k+'" '+(st.t2!=null?"disabled":"")+">"+esc(o)+"</button>"}).join("")+"</div></div>":"")+
  (solved?'<div class="done"><div class="dh">'+(st.score===2?"Отлично, обе задачи верно!":st.score===1?"Одна из двух — тоже прогресс.":"Ничего, разбор выше поможет запомнить.")+'</div><div class="note">+'+st.xp+' XP</div><div class="stack"><button class="btn" id="next">Следующая сцена</button>'+(S.saved[s.id]?"":'<button class="btn ghost" id="sv2">Сохранить фразу</button>')+"</div></div>":"");
  $("#back").onclick=function(){feed()};
  var pst=$("#pst");if(pst)pst.onclick=function(){if(canSpeak)try{speechSynthesis.cancel()}catch(e){}st.playing=1;$("#pw").innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+VIDS[s.id][0]+'?autoplay=1&rel=0&playsinline=1" title="Сцена" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>'};
  if(st.playing){var pw=$("#pw");if(pw)pw.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+VIDS[s.id][0]+'?rel=0&playsinline=1" title="Сцена" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>'}
  $("#sv").onclick=toggleSave;var sv2=$("#sv2");if(sv2)sv2.onclick=toggleSave;
  var sp=$("#sp");if(sp){sp.onclick=function(){speak(s.line)};$("#sps").onclick=function(){speak(s.line,.6)}}
  $("#trb").onclick=function(){st.tr=!st.tr;var y=window.scrollY;render();window.scrollTo(0,y)};
  app.querySelectorAll("[data-k]").forEach(function(b){b.onclick=function(){st.t1=+b.dataset.k;var ok=opts1[st.t1].ok;tone(!!ok);var y=window.scrollY;render();window.scrollTo(0,y)}});
  app.querySelectorAll("[data-k2]").forEach(function(b){b.onclick=function(){st.t2=+b.dataset.k2;var ok=opts2[st.t2]===s.gp[1][0];tone(ok);if(ok)speak(s.gp[0].replace("___",s.gp[1][0]));
   st.score=(opts1[st.t1].ok?1:0)+(ok?1:0);var first=!S.done[s.id];st.xp=first?5+st.score*5:2;S.done[s.id]=1;addXP(st.xp);var y=window.scrollY;render();window.scrollTo(0,y)}});
  var nx=$("#next");if(nx)nx.onclick=function(){LIST=feedList();var nxt=LIST.filter(function(x){return !S.done[x.id]})[0]||LIST.filter(function(x){return x.id!==s.id})[0];nxt?scene(nxt.id):feed()};
 }
 function toggleSave(){if(S.saved[s.id])delete S.saved[s.id];else S.saved[s.id]=Date.now();save();var y=window.scrollY;render();window.scrollTo(0,y)}
 render();toTop();
 if(canSpeak)setTimeout(function(){speak(s.line)},300);
}

/* ---------- shows ---------- */
function showsTab(){
 showNav("shows");
 app.innerHTML=topBar()+'<h1 class="h1s">Сериалы и фильмы</h1><p class="note" style="margin-bottom:16px">Выберите, чтобы смотреть сцены только оттуда.</p><div class="slist">'+Object.keys(SHOWS).map(function(k){var sh=SHOWS[k],all=SC.filter(function(s){return s.sh===k}),d=all.filter(function(s){return S.done[s.id]}).length;return '<button class="srow" data-k="'+k+'"><span class="sw" style="--c1:'+sh.c[0]+';--c2:'+sh.c[1]+'"></span><span class="sn"><b>'+esc(sh.t)+'</b><span class="note" lang="en">'+esc(sh.en)+'</span></span><span class="sc">'+d+"/"+all.length+"</span></button>"}).join("")+"</div>";
 wireTop();
 app.querySelectorAll(".srow").forEach(function(b){b.onclick=function(){FILTER=b.dataset.k;feed()}});toTop();
}
function savedTab(){
 showNav("saved");
 var ids=Object.keys(S.saved).sort(function(a,b){return S.saved[b]-S.saved[a]});
 app.innerHTML=topBar()+'<h1 class="h1s">Мои фразы</h1>'+(ids.length?'<p class="note" style="margin-bottom:16px">Нажмите на фразу, чтобы услышать её; на название — чтобы открыть сцену.</p><div class="slist">'+ids.map(function(id){var s=SC.filter(function(x){return x.id===id})[0];if(!s)return "";return '<div class="phr"><button class="pl" data-s="'+esc(s.line)+'" lang="en">'+esc(s.line)+'</button><div class="note">'+esc(s.ru)+'</div><button class="lnk" data-id="'+s.id+'">'+esc(SHOWS[s.sh].t)+" · "+esc(s.ti)+" ›</button></div>"}).join("")+"</div>":'<div class="empty"><p>Здесь появятся фразы, которые вы сохраните.</p><p class="note">В сцене нажмите на закладку вверху справа или на «Сохранить фразу» после задач.</p><button class="btn" id="tofeed" style="margin-top:14px">Открыть ленту</button></div>');
 wireTop();
 app.querySelectorAll(".pl").forEach(function(b){b.onclick=function(){speak(b.dataset.s)}});
 app.querySelectorAll(".lnk[data-id]").forEach(function(b){b.onclick=function(){scene(b.dataset.id)}});
 var tf=$("#tofeed");if(tf)tf.onclick=function(){FILTER="me";feed()};toTop();
}
S.lvl?feed():pickLevel();

})();
</script>
</body></html>
